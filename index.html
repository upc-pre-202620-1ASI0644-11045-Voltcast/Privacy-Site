    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></symbol>

  <header class="hero">
    <h1>VoltCast</h1>
    <p class="tagline">
      <span lang="es">Pronóstico de voltaje de celdas</span>
      <span class="sep" aria-hidden="true">/</span>
      <span lang="en">Cell voltage forecasting</span>
    </p>
    <a class="btn" href="privacy.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      Política de privacidad / Privacy policy
    </a>
  </header>
  <main>
    <figure class="showcase">
      <div class="stage" role="img" aria-label="Tres pantallas de la app: celdas del supervisor, inventario de ánodos y cátodos, y pronósticos de voltaje / Three app screens: supervisor cells, anode and cathode inventory, and voltage forecasts">

        <!-- 1 · Inicio -->
        <div class="phone">
          <div class="screen">
            <div class="ah">
              <div class="bar"><span class="brand"><span class="badge"><svg class="icon"><use href="#i-zap"/></svg></span>VoltCast</span><span><span class="round dot"><svg class="icon"><use href="#i-bell"/></svg></span><span class="round"><svg class="icon"><use href="#i-out"/></svg></span></span></div>
              <div class="greet"><div><small>Supervisor · 3 celdas</small><b>Hola, Ana</b></div><span class="cta"><svg class="icon"><use href="#i-plus"/></svg>Nueva</span></div>
            </div>
            <div class="stats"><div><b>3</b>Registradas</div><div><b class="ok">3</b>Activas</div><div><b class="dim">0</b>Inactivas</div></div>
            <div class="body">
              <div class="row"><h4>Tus celdas</h4><span class="seg"><i class="on">Todas</i><i>Activas</i></span></div>
              <div class="card">
                <div class="cell"><span class="thumb"><svg><use href="#cell"/></svg></span><div><div class="row"><h5>Celda A1</h5><span class="pill ok">Activa</span></div><p><i class="an"></i>Ánodo<b>AND-001</b></p><p><i class="ca"></i>Cátodo<b>CAT-002</b></p><a>Ver componentes<svg class="icon"><use href="#i-chev"/></svg></a></div></div>
                <div class="acts"><span class="wide soft"><svg class="icon"><use href="#i-lock"/></svg>Cerrar celda</span><span class="sq"><svg class="icon"><use href="#i-qr"/></svg></span><span class="sq"><svg class="icon"><use href="#i-edit"/></svg></span><span class="sq bad"><svg class="icon"><use href="#i-trash"/></svg></span></div>
              </div>
              <div class="card">
                <div class="cell"><span class="thumb"><svg><use href="#cell"/></svg></span><div><div class="row"><h5>Celda A2</h5><span class="pill ok">Activa</span></div><p><i class="an"></i>Ánodo<b>AND-002</b></p><p><i class="ca"></i>Cátodo<b>CAT-001</b></p><a>Ver componentes<svg class="icon"><use href="#i-chev"/></svg></a></div></div>
                <div class="acts"><span class="wide solid"><svg class="icon"><use href="#i-unlock"/></svg>Abrir celda</span><span class="sq"><svg class="icon"><use href="#i-qr"/></svg></span><span class="sq"><svg class="icon"><use href="#i-edit"/></svg></span><span class="sq bad"><svg class="icon"><use href="#i-trash"/></svg></span></div>
              </div>
            </div>
            <nav class="tabs"><span class="on"><svg class="icon"><use href="#i-home"/></svg>Inicio</span><span><svg class="icon"><use href="#i-box"/></svg></span><span><svg class="icon"><use href="#i-chart"/></svg></span><span><svg class="icon"><use href="#i-users"/></svg></span></nav>
          </div>
        </div>

        <!-- 2 · Pronósticos (al frente) -->
        <div class="phone">
          <div class="screen">
            <div class="ah">
              <div class="bar"><span class="brand"><span class="badge"><svg class="icon"><use href="#i-zap"/></svg></span>VoltCast</span><span><span class="round dot"><svg class="icon"><use href="#i-bell"/></svg></span><span class="round"><svg class="icon"><use href="#i-out"/></svg></span></span></div>
              <div class="greet"><div><small>Voltaje estimado · 30 oct</small><b>Pronósticos</b></div></div>
            </div>
            <div class="stats"><div><b>3</b>Celdas</div><div><b class="bad">1</b>Superan el límite</div><div><b class="dim">0</b>Sin límite</div></div>
            <div class="body">
              <div class="chips"><i class="on">Hoy</i><i>Mañana</i><i>En 3 días</i><i>En 7 días</i></div>
              <p class="note"><svg class="icon"><use href="#i-info"/></svg>El modelo se está reentrenando: los valores pueden cambiar en los próximos minutos.</p>
              <div class="search"><svg class="icon"><use href="#i-search"/></svg>Buscar por código…<i>Solo alertas</i></div>
              <h4>Superan el límite <em>1</em></h4>
              <div class="fc alert"><span class="code">A2</span><div><div class="row"><h5>Celda A2</h5><span class="pill warn"><svg class="icon"><use href="#i-alert"/></svg>Supera</span></div><span class="meter"><i style="width:94%"></i></span><small>Límite 4.50 V</small></div><div class="v"><b>4.71<small> V</small></b><small>+0.21 V</small></div></div>
              <h4>Dentro del límite <em class="ok">2</em></h4>
              <div class="fc"><span class="code">A1</span><div><div class="row"><h5>Celda A1</h5></div><span class="meter ok"><i style="width:80%"></i></span><small>Límite 4.50 V</small></div><div class="v"><b>4.32<small> V</small></b><small>−0.18 V</small></div></div>
              <div class="fc"><span class="code">A3</span><div><div class="row"><h5>Celda A3</h5></div><span class="meter ok"><i style="width:72%"></i></span><small>Límite 4.50 V</small></div><div class="v"><b>4.18<small> V</small></b><small>−0.32 V</small></div></div>
            </div>
            <nav class="tabs"><span><svg class="icon"><use href="#i-home"/></svg></span><span><svg class="icon"><use href="#i-box"/></svg></span><span class="on"><svg class="icon"><use href="#i-chart"/></svg>Pronósticos</span><span><svg class="icon"><use href="#i-users"/></svg></span></nav>
          </div>
        </div>

        <!-- 3 · Inventario -->
        <div class="phone">
          <div class="screen">
            <div class="ah">
              <div class="bar"><span class="brand"><span class="badge"><svg class="icon"><use href="#i-zap"/></svg></span>VoltCast</span><span><span class="round dot"><svg class="icon"><use href="#i-bell"/></svg></span><span class="round"><svg class="icon"><use href="#i-out"/></svg></span></span></div>
              <div class="greet"><div><small>Ánodos y cátodos</small><b>Inventario</b></div><span class="cta"><svg class="icon"><use href="#i-plus"/></svg>Nuevo</span></div>
            </div>
            <div class="stats"><div><b>7</b>Registrados</div><div><b class="info">6</b>En uso</div><div><b class="ok">1</b>Libres</div></div>
            <div class="body">
              <div class="search"><svg class="icon"><use href="#i-search"/></svg>Buscar por código…</div>
              <div class="chips"><i class="on">Todos</i><i>Libres · 1</i><i>En uso · 6</i></div>
              <div class="grid">
                <div class="item"><span class="thumb"><span class="pill ok">Libre</span><svg viewBox="0 0 100 70"><ellipse cx="50" cy="64" rx="20" ry="3.5" fill="#0b1a3a" opacity=".12"/><g transform="rotate(30 50 34) translate(6 0)"><rect x="42" y="8" width="16" height="52" rx="4" fill="#4b5157"/><text x="50" y="33" transform="rotate(-90 50 33)">CAT-009</text></g></svg></span><small>Cátodo</small><h5>CAT-009</h5><span class="mini"><i><svg class="icon"><use href="#i-edit"/></svg></i><i><svg class="icon"><use href="#i-swap"/></svg></i><i class="bad"><svg class="icon"><use href="#i-trash"/></svg></i></span></div>
                <div class="item"><span class="thumb"><span class="pill info">En uso</span><svg viewBox="0 0 100 70"><ellipse cx="50" cy="64" rx="20" ry="3.5" fill="#0b1a3a" opacity=".12"/><g transform="rotate(30 50 34) translate(6 0)"><rect x="42" y="8" width="16" height="52" rx="4" fill="#b86a35"/><text x="50" y="33" transform="rotate(-90 50 33)">AND-003</text></g></svg></span><small>Ánodo</small><h5>AND-003</h5><span class="mini"><i><svg class="icon"><use href="#i-edit"/></svg></i><i><svg class="icon"><use href="#i-swap"/></svg></i><i class="bad"><svg class="icon"><use href="#i-trash"/></svg></i></span></div>
                <div class="item"><span class="thumb"><span class="pill info">En uso</span><svg viewBox="0 0 100 70"><ellipse cx="50" cy="64" rx="20" ry="3.5" fill="#0b1a3a" opacity=".12"/><g transform="rotate(30 50 34) translate(6 0)"><rect x="42" y="8" width="16" height="52" rx="4" fill="#4b5157"/><text x="50" y="33" transform="rotate(-90 50 33)">CAT-002</text></g></svg></span><small>Cátodo</small><h5>CAT-002</h5><span class="mini"><i><svg class="icon"><use href="#i-edit"/></svg></i><i><svg class="icon"><use href="#i-swap"/></svg></i><i class="bad"><svg class="icon"><use href="#i-trash"/></svg></i></span></div>
                <div class="item"><span class="thumb"><span class="pill info">En uso</span><svg viewBox="0 0 100 70"><ellipse cx="50" cy="64" rx="20" ry="3.5" fill="#0b1a3a" opacity=".12"/><g transform="rotate(30 50 34) translate(6 0)"><rect x="42" y="8" width="16" height="52" rx="4" fill="#b86a35"/><text x="50" y="33" transform="rotate(-90 50 33)">AND-001</text></g></svg></span><small>Ánodo</small><h5>AND-001</h5><span class="mini"><i><svg class="icon"><use href="#i-edit"/></svg></i><i><svg class="icon"><use href="#i-swap"/></svg></i><i class="bad"><svg class="icon"><use href="#i-trash"/></svg></i></span></div>
              </div>
            </div>
            <nav class="tabs"><span><svg class="icon"><use href="#i-home"/></svg></span><span class="on"><svg class="icon"><use href="#i-box"/></svg>Inventario</span><span><svg class="icon"><use href="#i-chart"/></svg></span><span><svg class="icon"><use href="#i-users"/></svg></span></nav>
          </div>
        </div>

      </div>
      <figcaption>Las imágenes de referencia no reflejan el 100% del producto final</figcaption>
    </figure>
  </main>
